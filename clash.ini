[custom]
; --- 基础设置 ---
enable_rule_generator=true
overwrite_original_rules=true

; --- 策略组定义 (Proxy Groups) ---

; 1. 核心入口 (总管)
custom_proxy_group=🚀 节点选择`select`[]🤏 手动选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌍 其他地区`[]🎯 全球直连

; 2. 手动选择 (包含所有节点)
custom_proxy_group=🤏 手动选择`select`.*

; 3. 开发与代码 (GitHub)
; 已加入所有分组，默认首选自动或香港
custom_proxy_group=🐱 GitHub`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🌍 其他地区`[]🎯 全球直连`[]🤏 手动选择

; 4. 人工智能细分 (已加入所有分组)
; 4.1 ChatGPT
custom_proxy_group=💬 ChatGPT`select`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🌍 其他地区`[]🤏 手动选择

; 4.2 Gemini
custom_proxy_group=💎 Gemini`select`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🌍 其他地区`[]🤏 手动选择

; 4.3 其他 AI
custom_proxy_group=🤖 其他AI`select`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🌍 其他地区`[]🤏 手动选择

; 5. 流媒体分组 (已加入所有分组)
; 5.1 YouTube
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌍 其他地区`[]🤏 手动选择

; 5.2 Netflix
custom_proxy_group=🎬 奈飞视频`select`[]🚀 节点选择`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]♻️ 自动选择`[]🌍 其他地区`[]🤏 手动选择

; 5.3 Disney+
custom_proxy_group=🐭 迪士尼+`select`[]🚀 节点选择`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]♻️ 自动选择`[]🌍 其他地区`[]🤏 手动选择

; 6. 常用服务 (已加入所有分组)
; 6.1 Telegram
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🌍 其他地区`[]🤏 手动选择

; 6.2 Google
custom_proxy_group=☁️ 谷歌服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌍 其他地区`[]🤏 手动选择

; 6.3 Apple
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🌍 其他地区`[]🤏 手动选择

; 7. 国家/地区自动分组 (正则筛选 - 保持不变)
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)港|HK|Hong`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇹🇼 台湾节点`url-test`(?i)台|TW|Tai`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)日|JP|Japan`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)新|SG|Singapore`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇺🇸 美国节点`url-test`(?i)美|US|States|United`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🌍 其他地区`select`(?i)^(?!.*(?:港|HK|Hong|台|TW|Tai|日|JP|Japan|新|SG|Singapore|美|US|States|中|CN|China|回国)).*

; 8. 功能性分组
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌍 其他地区`[]🎯 全球直连`[]🤏 手动选择

; --- 规则集定义 (Rule Sets) ---

; 1. 开发者规则 (GitHub 优先)
ruleset=🐱 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list

; 2. AI 规则
ruleset=💬 ChatGPT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=💎 Gemini,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
