[custom]
; --- 基础设置 ---
enable_rule_generator=true
overwrite_original_rules=true

; --- 策略组定义 (Proxy Groups) ---

; 1. 核心入口
custom_proxy_group=🚀 节点选择`select`[]🤏 手动选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌍 其他地区`[]🎯 全球直连

; 2. 手动选择
custom_proxy_group=🤏 手动选择`select`.*

; 3. 开发与代码 (GitHub)
custom_proxy_group=🐱 GitHub`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🌍 其他地区`[]🎯 全球直连`[]🤏 手动选择

; 4. 人工智能细分
custom_proxy_group=💬 ChatGPT`select`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🌍 其他地区`[]🤏 手动选择

custom_proxy_group=💎 Gemini`select`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🌍 其他地区`[]🤏 手动选择

custom_proxy_group=🤖 其他AI`select`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🌍 其他地区`[]🤏 手动选择

; 5. 流媒体分组
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌍 其他地区`[]🤏 手动选择

custom_proxy_group=🎬 奈飞视频`select`[]🚀 节点选择`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]♻️ 自动选择`[]🌍 其他地区`[]🤏 手动选择

custom_proxy_group=🐭 迪士尼+`select`[]🚀 节点选择`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]♻️ 自动选择`[]🌍 其他地区`[]🤏 手动选择

; 6. 常用服务
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🌍 其他地区`[]🤏 手动选择

custom_proxy_group=☁️ 谷歌服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌍 其他地区`[]🤏 手动选择

custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🇸🇬 新加坡节点`[]🌍 其他地区`[]🤏 手动选择

; 7. 国家/地区自动分组 (关键修改：更换为 Cloudflare 测速链接)
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)港|HK|Hong`https://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇹🇼 台湾节点`url-test`(?i)台|TW|Tai`https://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)日|JP|Japan`https://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)新|SG|Singapore`https://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇺🇸 美国节点`url-test`(?i)美|US|States|United`https://www.gstatic.com/generate_204`300`50

; 其他地区也更换链接，防止误判
custom_proxy_group=🌍 其他地区`select`(?i)^(?!.*(?:港|HK|Hong|台|TW|Tai|日|JP|Japan|新|SG|Singapore|美|US|States|中|CN|China|回国)).*`https://www.gstatic.com/generate_204`300`50
; 8. 功能性分组
; 自动选择也同步更换链接
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300`50
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌍 其他地区`[]🎯 全球直连`[]🤏 手动选择

; --- 规则集定义 (Rule Sets) ---

; 1. 开发者规则 (GitHub)
ruleset=🐱 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list

; 2. AI 规则
ruleset=💬 ChatGPT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=💎 Gemini,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=🤖 其他AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=🤖 其他AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Bing/Bing.list
ruleset=🤖 其他AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.list

; 3. 流媒体规则
ruleset=📹 油管视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=🎬 奈飞视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=🐭 迪士尼+,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list

; 4. 社交与常用
ruleset=📲 电报消息,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=☁️ 谷歌服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list

; 5. 微软规则 (注意位置)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list

; 6. 拦截规则
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Hijacking/Hijacking.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Privacy/Privacy.list

; 7. 直连规则
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Classical.list

; 8. 兜底
ruleset=🐟 漏网之鱼,[]FINAL
