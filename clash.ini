[custom]
; --- 基础设置 ---
; 开启规则生成器
enable_rule_generator=true
; 覆盖原有规则
overwrite_original_rules=true

; --- 策略组定义 (Proxy Groups) ---
; 格式: custom_proxy_group=组名`类型`分组包含的节点(正则或组名)`URL检测链接`检测间隔`超时时间

; 1. 核心策略
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇪🇺 欧洲节点`[]🎯 全球直连

; 2. 人工智能 (ChatGPT/Claude/Gemini)
; 推荐包含美国、新加坡、日本，避免自动选择跳到不支持的地区
custom_proxy_group=✨ 人工智能`select`[]🚀 节点选择`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]♻️ 自动选择

; 3. 流媒体分组
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点
custom_proxy_group=🎬 奈飞视频`select`[]🚀 节点选择`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇸 美国节点
custom_proxy_group=🐭 迪士尼+`select`[]🚀 节点选择`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇺🇸 美国节点

; 4. 常见服务
custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇭🇰 香港节点
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择
custom_proxy_group=☁️ 谷歌服务`select`[]🚀 节点选择`[]🇺🇸 美国节点`[]🇭🇰 香港节点

; 5. 国家/地区自动分组 (基于正则筛选)
custom_proxy_group=🇭🇰 香港节点`url-test`(?i)港|HK|Hong`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇯🇵 日本节点`url-test`(?i)日|JP|Japan`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇺🇸 美国节点`url-test`(?i)美|US|States|United`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(?i)新|SG|Singapore`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🇪🇺 欧洲节点`url-test`(?i)欧|EU|DE|UK|FR|Germany`http://www.gstatic.com/generate_204`300`50

; 6. 功能分组
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300`50
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连

; --- 规则集定义 (Rule Sets) ---
; 格式: ruleset=策略组名称,规则集URL
; 规则源采用 blackmatrix7 (更新最快最全)

; 1. AI 规则
ruleset=✨ 人工智能,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=✨ 人工智能,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.list
ruleset=✨ 人工智能,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list

; 2. 流媒体规则
ruleset=📹 油管视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=🎬 奈飞视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=🐭 迪士尼+,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
; 包含巴哈姆特、HBO等其他流媒体
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list

; 3. 社交与服务
ruleset=📲 电报消息,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list
ruleset=☁️ 谷歌服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list

; 4. 安全与拦截
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Hijacking/Hijacking.list

; 5. 地区与直连规则
; 局域网
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list
; 中国大陆域名和IP
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Classical.list

; 6. 兜底 (自动匹配)
; 放在最后，未匹配的走漏网之鱼
ruleset=🐟 漏网之鱼,[]FINAL
